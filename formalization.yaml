fidelity:
  divergences: The compared theorem is a statement about the kernel Phi as defined
    in the Challenge file. The source manuscript states the same counterexample
    in the Csordas-Dimitrov normalisation as well, where the origin value reads
    -7.8376e19; that restatement is not formalized, and the two differ by the positive
    factor recorded in the Csordas-Dimitrov source note. No other known divergence.
review:
  status: agent-reviewed
  reviewers:
  - Claude Code agents (independent per-file rebuild and axiom audit)
  notes: 'Each file of the supporting library was rebuilt from source and its main
    theorems audited with print-axioms by an agent other than its author. The numerical
    value of J_9(0) was independently recomputed from the definition of Phi at 60
    decimal digits, by Cauchy-integral differentiation on a circle of radius 0.2,
    agreeing with the source manuscript to ten significant figures. No human expert
    has reviewed the mathematics, and the source manuscript has not been peer reviewed.
    Provenance chronology: the counterexample was found in this project on 3-4 August
    2026. Subsequently, two independent LLM-assisted exact-certificate proofs were
    publicly deposited by Kielhorn on 11 August and Koide on 15 August 2026; both
    are cited in the source metadata, and both were audited here (their printed
    certificates reproduce under independent recomputation). Neither is a proof-assistant
    formalization. This chronology is recorded for provenance; no claim of first
    public presentation is made. No other proof-assistant formalization of this
    result was identified in the literature search completed 26 August 2026; that
    search is recorded but not exhaustive, and absence from search is not proof
    of open status.'
alignment:
  namespace: CsordasCounterexample
  statements:
  - source: Corollary 4.1 of the source manuscript
    lean: CsordasCounterexample.J_nine_neg
    module: Challenge
    status: proved
    note: The manuscript states the corollary as "the assertion that J_n(t) > 0
      for all t and all n fails at n = 9". The compared theorem is the witness,
      J_9(0) < 0, from which that failure is immediate.
