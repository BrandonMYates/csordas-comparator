  note: Mathlib has no Riemann kernel Phi. The kernel, its evenness (proved from
    Mathlib's Gaussian Poisson summation), and the derivatives at the origin are
    all built in the supporting library.
status:
  scope: 'Proved: J_9(0) < 0, and hence that the assertion "J_n(t) > 0 for all real
    t and all n" is false. The proof establishes, along the way, that Phi is even
    and that Phi^(8)(0) and Phi^(10)(0) are both positive. NOT proved and NOT claimed:
    the concavity theorem and double-Turan corollary of the source manuscript; the
    full sign sequence of Phi^(2j)(0) beyond the indices the counterexample needs;
    and any statement about the interval on which J_9 is negative.'
